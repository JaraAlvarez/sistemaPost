<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consola de prueba · PosSupermercado</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Consola de PRUEBA (solo desarrollo). No es la interfaz definitiva: esa se diseña en la Fase 15. -->
  <header>
    <div class="brand">PosSupermercado <span class="tag">consola de prueba</span></div>
    <div id="user" class="user hidden"><span id="userName"></span><button id="logout" class="link">Salir</button></div>
  </header>

  <main>
    <section id="loginView" class="card narrow">
      <h1>Iniciar sesión</h1>
      <form id="loginForm">
        <label>Usuario <input id="username" autocomplete="username" required></label>
        <label>Contraseña <input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Entrar</button>
      </form>
      <p class="hint">Datos de prueba: usuario <b>dueno</b>, contraseña <b>Sup3rmercado-Seguro</b>.</p>
      <div id="loginError" class="error hidden"></div>
    </section>

    <section id="appView" class="hidden">
      <nav id="tabs">
        <button data-tab="products" class="active">Productos</button>
        <button data-tab="scan">Leer código</button>
        <button data-tab="stock">Existencias</button>
        <button data-tab="purchases">Compras</button>
        <button data-tab="audit">Auditoría</button>
        <button data-tab="company">Empresa</button>
        <button data-tab="sales" class="soon">Ventas (Fase 7)</button>
      </nav>

      <div id="error" class="error hidden"></div>

      <div class="tab" id="tab-products">
        <form class="toolbar" id="productSearch">
          <input id="productQuery" placeholder="Buscar por nombre, SKU o código de barras">
          <button type="submit">Buscar</button>
        </form>
        <div id="productsTable"></div>
      </div>

      <div class="tab hidden" id="tab-scan">
        <form class="toolbar" id="scanForm">
          <input id="scanCode" placeholder="Código de barras, SKU o etiqueta de báscula (ej. 7702511000014)" autofocus>
          <button type="submit">Leer</button>
        </form>
        <div id="scanResult"></div>
      </div>

      <div class="tab hidden" id="tab-stock">
        <div class="toolbar"><button id="reloadStock">Actualizar</button></div>
        <div id="stockTable"></div>
        <h2 id="kardexTitle" class="hidden"></h2>
        <div id="kardexTable"></div>
      </div>

      <div class="tab hidden" id="tab-purchases"><div id="purchasesTable"></div></div>
      <div class="tab hidden" id="tab-audit"><div id="auditTable"></div></div>
      <div class="tab hidden" id="tab-company"><div id="companyInfo"></div></div>
      <div class="tab hidden" id="tab-sales">
        <div class="card">
          <h2>Ventas</h2>
          <p>El punto de venta (escanear, cobrar con pagos combinados, suspender, anular y cambios de mercancía) se está construyendo en la Fase 7.
             Aparecerá aquí cuando esté terminado.</p>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
