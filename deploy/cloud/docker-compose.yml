# Servidor de licencias (Fase 12-A) en el VPS: aplicación + PostgreSQL 18 + Caddy (HTTPS automático con Let's Encrypt).
# Guía completa: docs/despliegue-nube.md.
#   cp .env.example .env   # y complete los valores
#   docker compose up -d --build
# Solo Caddy publica puertos (80/443). La aplicación y PostgreSQL quedan en la red interna de Docker.
name: pos-cloud

x-app-image: &app-image
  image: ${POS_CLOUD_IMAGE:-pos-cloud:local}
  build:
    context: ../..
    dockerfile: src/Cloud/Pos.Cloud.Host/Dockerfile

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Defina POSTGRES_SUPERUSER_PASSWORD en .env}
      # Solo scram-sha-256 para las conexiones por red.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      # PostgreSQL 18: el volumen se monta en /var/lib/postgresql (los datos quedan en 18/docker).
      - pgdata:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    shm_size: 128mb

  # Crea (o actualiza) la BD pos_cloud y los roles pos_owner/pos_migrator/pos_app/pos_backup y aplica las migraciones.
  # Es idempotente: se ejecuta en cada `docker compose up` y termina; la aplicación arranca solo si terminó bien.
  db-init:
    <<: *app-image
    restart: "no"
    command:
      - setup-database
      - --superuser
      - "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_SUPERUSER_PASSWORD};Database=postgres"
      - --database
      - pos_cloud
      - --migrator-password
      - "${DB_MIGRATOR_PASSWORD:?Defina DB_MIGRATOR_PASSWORD en .env}"
      - --app-password
      - "${DB_APP_PASSWORD:?Defina DB_APP_PASSWORD en .env}"
      - --backup-password
      - "${DB_BACKUP_PASSWORD:?Defina DB_BACKUP_PASSWORD en .env}"
    healthcheck:
      disable: true
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *app-image
    restart: unless-stopped
    environment:
      Cloud__Database__ConnectionString: "Host=postgres;Port=5432;Database=pos_cloud;Username=pos_app;Password=${DB_APP_PASSWORD}"
      # Las migraciones las aplica db-init con pos_migrator: la aplicación no tiene credenciales de DDL.
      Cloud__Database__MigrateOnStartup: "false"
      Cloud__DataProtectionKeysPath: /var/lib/pos-cloud/dataprotection
      # Solo Caddy llega a la aplicación (su puerto no se publica).
      Cloud__TrustForwardedHeaders: "true"
      # Vacío (lo normal): el servidor vive en la raíz de su (sub)dominio. Solo si se publica bajo una ruta de un dominio compartido
      # (p. ej. /businesspost): docs/despliegue-nube.md §18.
      Cloud__PathBase: ${CLOUD_PATH_BASE:-}
      Licensing__Signing__PrivateKeyPath: /run/secrets/signing_key
      Licensing__LatestPosVersion: ${LATEST_POS_VERSION:-}
      # Fase 16: clave X25519 que abre los paquetes .possync cargados en el portal (docs/despliegue-nube.md §17).
      Sync__PrivateKeyPath: /run/secrets/sync_key
      # Acceso al portal (ADR-0062): "Ingresar con Google" solo si hay ClientId y secreto; TOTP opcional salvo PORTAL_REQUIRE_TOTP=true.
      Portal__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Portal__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Portal__RequireTotp: ${PORTAL_REQUIRE_TOTP:-false}
      TZ: America/Bogota
      # Registros: información propia; el detalle de ASP.NET Core y EF Core solo desde advertencias.
      Serilog__MinimumLevel__Default: Information
      Serilog__MinimumLevel__Override__Microsoft.AspNetCore: Warning
      Serilog__MinimumLevel__Override__Microsoft.EntityFrameworkCore: Warning
    secrets:
      - signing_key
      - sync_key
    volumes:
      - dataprotection:/var/lib/pos-cloud/dataprotection
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [backend, frontend]
    depends_on:
      db-init:
        condition: service_completed_successfully

  # Fase 11 · Nube de backups de las tiendas (compatible S3). Opcional: se activa con `docker compose --profile backups up -d`.
  # Guarda archivos .posbak ya cifrados en cada tienda: ni el VPS ni el portal pueden leerlos (ver docs/despliegue-nube.md §14).
  # MinIO server es AGPL-3.0: se usa sin modificar como servicio aparte (no se distribuye con el POS).
  minio:
    image: minio/minio:latest
    profiles: [backups]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-posadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cambie-esta-clave-larga}
      TZ: America/Bogota
    volumes:
      - minio_data:/data
    networks: [frontend]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO:?Defina DOMINIO en .env}
      ACME_EMAIL: ${ACME_EMAIL:?Defina ACME_EMAIL en .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Fase 13: manifiestos firmados y paquetes de actualización del POS (docs/despliegue-nube.md §16).
      - ./updates:/srv/updates:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [frontend]
    depends_on:
      - app

# La clave privada Ed25519 ACTIVA se monta como archivo de solo lectura en /run/secrets/signing_key.
# En el servidor: dueño UID 1654 (usuario de la imagen) y permisos 400 (ver la guía).
secrets:
  signing_key:
    file: ${SIGNING_KEY_FILE:-./secrets/signing-key.pem}
  sync_key:
    file: ${SYNC_KEY_FILE:-./secrets/sync-key.txt}

networks:
  backend:
    internal: true
  frontend:

volumes:
  pgdata:
  dataprotection:
  caddy_data:
  caddy_config:
  minio_data:
